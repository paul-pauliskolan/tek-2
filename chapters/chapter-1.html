<head>

    <title>Kapitel - Teknik 2 information och medieteknik</title>

</head>

<body class="chapter-page">
    <nav class="navbar">
        <a href="../index.html" class="logo">⚙️ Teknik 2</a>
        <button class="menu-toggle" id="menu-toggle" aria-label="Öppna kapitelmeny">☰</button>
    </nav>

    <aside class="side-menu" id="side-menu" aria-label="Kapitelmeny">
        <a href="../index.html" class="menu-close" id="menu-close" aria-label="Stäng kapitelmeny">✕</a>
        <h2>Kapitel</h2>
        <nav class="chapter-menu" id="chapters-menu"></nav>
    </aside>

    <main class="container chapter-shell">
        <article class="chapter-main">
            <header class="chapter-hero">
                <p class="eyebrow">Teknik 2</p>
                <h1><a href="../index.html">⚙️ Teknik 2</a></h1>
            </header>

            <div class="chapter-header"></div>

            <section id="chapter-content"></section>
            <section id="chapter-summary"></section>

            <div class="chapter-nav"></div>
        </article>

        <aside class="chapter-aside">
            <section class="aside-card">
                <p class="eyebrow">Innehåll</p>
                <h2>Klickbar innehållsförteckning</h2>
                <p>Hoppa direkt till valfri del i kapitlet.</p>
                <nav id="chapter-toc" class="chapter-toc" aria-label="Innehållsförteckning för kapitlet"></nav>
            </section>
        </aside>
    </main>

    <footer class="site-footer site-footer-wide">
        <p><a href="../index.html">Till startsidan</a> | <a
                href="https://docs.google.com/forms/d/e/1FAIpQLSc8fyjjAhtlfX3u6UeVvk6AlF_3-ow0UdZmgP3QtJIn5s7_hw/viewform?usp=dialog"
                target="_blank" rel="noopener noreferrer">Kontakt / Återkoppling</a></p>
    </footer>

    <script src="../js/main.js"></script>
    <script>
        function insertDevelopmentLinkUnderHeading() {
            const content = document.getElementById('chapter-content')
            if (!content) return false

            const headings = content.querySelectorAll('h2, h3')
            const targetHeading = Array.from(headings).find((el) => {
                const txt = el.textContent.trim().toLowerCase()
                return txt === 'teknikutvecklingsprocessens steg' || txt === 'teknikkutvecklingsprocessens steg'
            })

            if (!targetHeading) return false
            if (content.querySelector('.development-link-under-steps')) return true

            const wrapper = document.createElement('div')
            wrapper.className = 'development-link-under-steps'
            const link = document.createElement('a')
            link.href = 'chapter-1-development.html'
            link.target = '_blank'
            link.rel = 'noopener noreferrer'
            link.textContent = 'Öppna Teknikutvecklingsprocessens steg (ny flik)'
            const linkRow = document.createElement('p')
            linkRow.appendChild(link)

            const image = document.createElement('img')
            image.src = '../assets/images/teknikutveckling.png'
            image.alt = 'Flödesschema för teknikutvecklingsprocessen'
            image.style.display = 'block'
            image.style.maxWidth = '100%'
            image.style.height = 'auto'
            image.style.marginTop = '12px'

            wrapper.appendChild(linkRow)
            wrapper.appendChild(image)

            targetHeading.insertAdjacentElement('afterend', wrapper)
            return true
        }

        function insertChapterQuiz() {
            const content = document.getElementById('chapter-content')
            if (!content) return false
            if (content.querySelector('.chapter-quiz')) return true

            const headings = content.querySelectorAll('h2')
            const targetHeading = Array.from(headings).find((el) => {
                const txt = el.textContent.trim().toLowerCase()
                return txt === 'reflektionsfrågor' || txt === 'refelktionsfrågor' || txt === 'frågor att arbeta med'
            })

            if (!targetHeading) return false

            const questions = [
                {
                    text: 'Vad kännetecknar ett projekt?',
                    options: [
                        'Ett arbete med tydligt mål, tidsplan och slut.',
                        'Ett arbete som aldrig avslutas.',
                        'En samling löpande uppgifter utan gemensamt mål.',
                        'Ett spontant arbete utan planering.'
                    ],
                    answer: 'A',
                    explanation: 'Ett projekt är avgränsat i tid och har ett tydligt mål, en tidsplan och ett slut.'
                },
                {
                    text: 'Varför är planering viktig i ett tekniskt projekt?',
                    options: [
                        'För att projektet ska kunna undvika all testning.',
                        'För att mål, arbetsuppgifter, resurser och tidsplan blir tydliga.',
                        'För att alla ska arbeta med samma uppgift samtidigt.',
                        'För att dokumentation inte längre behövs.'
                    ],
                    answer: 'B',
                    explanation: 'Planering gör arbetet tydligare och minskar risken för stress, missförstånd och förseningar.'
                },
                {
                    text: 'Vad innebär iterativ utveckling?',
                    options: [
                        'Att hela projektet görs färdigt innan något testas.',
                        'Att projektet saknar tydliga roller.',
                        'Att man bygger, testar och förbättrar i flera omgångar.',
                        'Att dokumentationen skrivs först efter lansering.'
                    ],
                    answer: 'C',
                    explanation: 'Iterativ utveckling betyder att lösningen växer fram genom upprepade versioner, tester och förbättringar.'
                },
                {
                    text: 'Vilken roll kontrollerar ofta att systemet fungerar och letar efter fel?',
                    options: [
                        'Designer',
                        'Projektledare',
                        'Programmerare',
                        'Testare'
                    ],
                    answer: 'D',
                    explanation: 'Testaren kontrollerar att systemet fungerar och försöker hitta fel innan lösningen används.'
                },
                {
                    text: 'Vad är en MVP i ett agilt projekt?',
                    options: [
                        'En minsta fungerande produktversion som kan testas av användare.',
                        'En fullständig slutversion utan begränsningar.',
                        'En tidsplan för hela projektet.',
                        'En lista över alla möjliga framtida funktioner.'
                    ],
                    answer: 'A',
                    explanation: 'En MVP innehåller precis tillräckligt många funktioner för att kunna testas och ge användbar feedback.'
                }
            ]

            const quiz = document.createElement('section')
            quiz.className = 'content-section chapter-quiz'
            quiz.setAttribute('aria-labelledby', 'chapter-quiz-title')
            quiz.innerHTML = `
                <h2 id="chapter-quiz-title">Quiz</h2>
                <form class="chapter-quiz-form">
                    ${questions.map((question, questionIndex) => `
                        <fieldset class="quiz-question">
                            <legend>${questionIndex + 1}. ${question.text}</legend>
                            <div class="quiz-options">
                                ${question.options.map((option, optionIndex) => {
                                    const letter = String.fromCharCode(65 + optionIndex)
                                    const inputId = `quiz-q${questionIndex + 1}-${letter}`
                                    return `
                                        <label class="quiz-option" for="${inputId}">
                                            <input type="radio" id="${inputId}" name="quiz-q${questionIndex + 1}" value="${letter}">
                                            <span class="quiz-option-letter">${letter}</span>
                                            <span>${option}</span>
                                        </label>
                                    `
                                }).join('')}
                            </div>
                            <p class="quiz-feedback" data-feedback-for="quiz-q${questionIndex + 1}"></p>
                        </fieldset>
                    `).join('')}
                    <button type="button" class="quiz-submit">Rätta quizet</button>
                    <p class="quiz-result" aria-live="polite"></p>
                </form>
            `

            const form = quiz.querySelector('.chapter-quiz-form')
            const result = quiz.querySelector('.quiz-result')
            const submit = quiz.querySelector('.quiz-submit')

            submit.addEventListener('click', () => {
                let score = 0

                questions.forEach((question, questionIndex) => {
                    const name = `quiz-q${questionIndex + 1}`
                    const selected = form.querySelector(`input[name="${name}"]:checked`)
                    const feedback = form.querySelector(`[data-feedback-for="${name}"]`)
                    const options = form.querySelectorAll(`input[name="${name}"]`)

                    options.forEach((option) => {
                        option.closest('.quiz-option').classList.remove('is-correct', 'is-wrong')
                    })

                    if (selected && selected.value === question.answer) {
                        score += 1
                        selected.closest('.quiz-option').classList.add('is-correct')
                        feedback.textContent = 'Rätt.'
                        feedback.className = 'quiz-feedback is-correct'
                    } else {
                        const correctInput = form.querySelector(`input[name="${name}"][value="${question.answer}"]`)
                        correctInput.closest('.quiz-option').classList.add('is-correct')
                        if (selected) {
                            selected.closest('.quiz-option').classList.add('is-wrong')
                            feedback.textContent = `Fel. Rätt svar är ${question.answer}. ${question.explanation}`
                        } else {
                            feedback.textContent = `Inget svar valt. Rätt svar är ${question.answer}. ${question.explanation}`
                        }
                        feedback.className = 'quiz-feedback is-wrong'
                    }
                })

                result.textContent = `Du fick ${score} av ${questions.length} rätt.`
            })

            targetHeading.insertAdjacentElement('beforebegin', quiz)
            return true
        }

        const match = window.location.pathname.match(/chapter-(\d+)\.html/)
        if (match) {
            const chapterNumber = parseInt(match[1], 10)
            const interval = setInterval(() => {
                if (window.pythonbook && window.pythonbook.getChapter(chapterNumber)) {
                    clearInterval(interval)
                    window.pythonbook.renderChapterPage(chapterNumber)
                    let tries = 0
                    const insertInterval = setInterval(() => {
                        tries += 1
                        const developmentLinkInserted = insertDevelopmentLinkUnderHeading()
                        const quizInserted = insertChapterQuiz()
                        if ((developmentLinkInserted && quizInserted) || tries > 40) {
                            clearInterval(insertInterval)
                        }
                    }, 100)
                }
            }, 100)
        }
    </script>
</body>

</html><!--  -->
